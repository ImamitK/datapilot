services:
  postgres:
    image: postgres:16
    container_name: datapilot-postgres
    environment:
      POSTGRES_DB: datapilot
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

