spring:
  application:
    name: datapilot-api

  datasource:
    url: jdbc:postgresql://localhost:5432/datapilot
    username: postgres
    password: postgres
    # For Docker comment above and uncomment below
    #username: datapilot
    #password: datapilot
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  error:
    include-message: always
    include-binding-errors: always